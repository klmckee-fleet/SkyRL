name: Replace Runner

on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: 'Runner to replace'
        required: true
        type: choice
        options:
          - fleet-runner-2
          - fleet-runner-5
          - fleet-runner-1
          - fleet-runner-3
          - fleet-runner-4

concurrency:
  group: replace-runner-${{ inputs.runner_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  recover:
    name: Recover ${{ inputs.runner_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Resolve runner config
        id: config
        run: |
          RUNNER_NAME="${{ inputs.runner_name }}"
          case "$RUNNER_NAME" in
            fleet-runner-1) INSTANCE_ID="i-04a15158610df980f" ;;
            fleet-runner-2) INSTANCE_ID="i-0f80c703294413a4c" ;;
            fleet-runner-3) INSTANCE_ID="i-09321b67952c1a208" ;;
            fleet-runner-4) INSTANCE_ID="i-0f2ccaa840ef29450" ;;
            fleet-runner-5) INSTANCE_ID="i-05ecd98e74949dc87" ;;
            *) echo "Unknown runner: $RUNNER_NAME"; exit 1 ;;
          esac
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "runner_name=$RUNNER_NAME" >> $GITHUB_OUTPUT

      - name: Check current status
        run: |
          STATUS=$(aws ec2 describe-instance-status --instance-ids "${{ steps.config.outputs.instance_id }}" --include-all-instances --query 'InstanceStatuses[0].[InstanceState.Name,InstanceStatus.Status,SystemStatus.Status]' --output text 2>/dev/null || echo "unknown")
          echo "Current status: $STATUS"
          echo "## Recovering ${{ steps.config.outputs.runner_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Instance:** ${{ steps.config.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status before:** $STATUS" >> $GITHUB_STEP_SUMMARY

      - name: Stop instance
        run: |
          INSTANCE_ID="${{ steps.config.outputs.instance_id }}"
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)

          if [ "$STATE" = "running" ]; then
            echo "Stopping instance..."
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
          elif [ "$STATE" = "stopping" ]; then
            echo "Instance already stopping..."
          elif [ "$STATE" = "stopped" ]; then
            echo "Instance already stopped"
            exit 0
          else
            echo "Instance in state: $STATE"
          fi

          echo "Waiting for instance to stop (up to 10 min)..."
          timeout 600 aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          echo "Instance stopped"

      - name: Start instance
        run: |
          INSTANCE_ID="${{ steps.config.outputs.instance_id }}"
          echo "Starting instance..."
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          echo "Waiting for instance to be running..."
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          echo "Instance is running"

      - name: Wait for status checks (extended)
        id: status
        run: |
          INSTANCE_ID="${{ steps.config.outputs.instance_id }}"
          echo "Waiting for instance to pass ALL status checks (up to 25 min)..."

          # Custom wait with progress — aws ec2 wait times out at 10 min by default
          START=$SECONDS
          MAX_WAIT=1500  # 25 minutes
          INTERVAL=30

          while [ $((SECONDS - START)) -lt $MAX_WAIT ]; do
            RESULT=$(aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --query 'InstanceStatuses[0].[InstanceState.Name,InstanceStatus.Status,SystemStatus.Status]' --output text 2>/dev/null)
            STATE=$(echo "$RESULT" | awk '{print $1}')
            INSTANCE_CHECK=$(echo "$RESULT" | awk '{print $2}')
            SYSTEM_CHECK=$(echo "$RESULT" | awk '{print $3}')

            ELAPSED=$((SECONDS - START))
            echo "[$((ELAPSED))s] State=$STATE Instance=$INSTANCE_CHECK System=$SYSTEM_CHECK"

            if [ "$STATE" = "running" ] && [ "$INSTANCE_CHECK" = "ok" ] && [ "$SYSTEM_CHECK" = "ok" ]; then
              echo "✅ All status checks passed!"
              echo "result=recovered" >> $GITHUB_OUTPUT
              echo "✅ **Instance recovered after stop/start**" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            sleep $INTERVAL
          done

          echo "❌ Status checks did not pass within 25 minutes"
          echo "result=failed" >> $GITHUB_OUTPUT

          # Get final status
          FINAL=$(aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --include-all-instances --query 'InstanceStatuses[0].[InstanceState.Name,InstanceStatus.Status,SystemStatus.Status]' --output text)
          echo "Final status: $FINAL"
          echo "❌ **Recovery failed.** Final status: $FINAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The instance may need to be **terminated and recreated** from the AMI." >> $GITHUB_STEP_SUMMARY
          echo "See \`docs/gha-runner-setup.md\` for instructions." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Wait for runner to come online
        if: steps.status.outputs.result == 'recovered'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for runner to register online (up to 10 min)..."
          for i in $(seq 1 60); do
            RUNNER_STATUS=$(gh api "repos/${{ github.repository }}/actions/runners" --paginate --jq ".runners[] | select(.name == \"${{ steps.config.outputs.runner_name }}\") | .status" 2>/dev/null)
            if [ "$RUNNER_STATUS" = "online" ]; then
              echo "✅ Runner ${{ steps.config.outputs.runner_name }} is online!"
              echo "✅ **Runner is online and ready**" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            [ $((i % 6)) -eq 0 ] && echo "Attempt $i/60: status=$RUNNER_STATUS"
            sleep 10
          done
          echo "⚠️ Runner not yet online. The runner service may need to be restarted on the instance."
          echo "⚠️ **Runner not yet online** — may need \`sudo systemctl restart actions.runner.fleet-ai-SkyRL.*\` on instance" >> $GITHUB_STEP_SUMMARY

      - name: Alert Slack on success
        if: steps.status.outputs.result == 'recovered'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#fleet-training-runs",
              "text": "✅ Runner Recovered: ${{ steps.config.outputs.runner_name }}",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "✅ Runner Recovered" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*${{ steps.config.outputs.runner_name }}* (`${{ steps.config.outputs.instance_id }}`) recovered via manual stop/start with extended wait." }
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>" }
                  ]
                }
              ]
            }

      - name: Alert Slack on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#fleet-training-runs",
              "text": "❌ Runner Recovery Failed: ${{ steps.config.outputs.runner_name }}",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "❌ Runner Recovery Failed" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*${{ steps.config.outputs.runner_name }}* (`${{ steps.config.outputs.instance_id }}`) could not be recovered via stop/start.\n\nThe instance likely needs to be *terminated and recreated* from the AMI.\nSee `docs/gha-runner-setup.md` for manual instructions." }
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>" }
                  ]
                }
              ]
            }
