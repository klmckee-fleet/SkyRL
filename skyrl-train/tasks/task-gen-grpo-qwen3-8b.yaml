# Task Generation GRPO Training via SkyPilot - Qwen3-8B
# Usage: sky launch tasks/task-gen-grpo-qwen3-8b.yaml --env FLEET_API_KEY=<key> --env WANDB_API_KEY=<key>
#
# This task trains GRPO on a task-generation environment. The LLM generates
# (prompt, verifier) pairs for Fleet environments, and reward comes from
# inner-loop rollouts that measure learnability and model separation.
#
# Model: Qwen/Qwen3-8B
# GPUs: 1 (bottleneck is Fleet rollouts, not inference)
# Single-turn: one generation = one task = one episode

name: task-gen-grpo-qwen3-8b

resources:
  disk_size: 256
  ports: 6479
  memory: 200+
  any_of:
    - accelerators: B200:1
      cloud: lambda
    - accelerators: B200:1
      cloud: runpod
    - accelerators: H200-SXM:1
      cloud: lambda
    - accelerators: H200-SXM:1
      cloud: runpod
    - accelerators: H200-SXM:1
      cloud: vast
    - accelerators: A100-80GB:1
      cloud: lambda
    - accelerators: A100-80GB:1
      cloud: runpod

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: deniz/task-scaling

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  DATA_VERSION: "v4"
  MODALITY: "tool_use"
  # Single-turn: one task generation per episode
  MAX_TURNS: 1
  MAX_INPUT_LENGTH: 4096
  MAX_GENERATE_LENGTH: 2048
  NUM_EPOCHS: 20
  RUN_ID: ""
  MAX_TASKS: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"
  # Task-gen env config
  TASK_GEN_ALPHA: "0.5"
  TASK_GEN_K_ROLLOUTS: "4"
  TASK_GEN_MODELS: "weak"

setup: |
  set -euo pipefail
  cd skyrl-train

  # Validate required environment variables
  echo "Validating environment variables..."
  if [ -z "$FLEET_API_KEY" ]; then echo "ERROR: FLEET_API_KEY is required"; exit 1; fi
  if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then echo "ERROR: AWS credentials required for S3 dataset download"; exit 1; fi
  echo "Environment validation passed"

  uv venv --python 3.12 --seed
  source .venv/bin/activate
  uv sync --extra vllm
  uv pip install wandb boto3 awscli

  # Install OpenEnv with task_evaluator support (from branch)
  uv pip install "git+https://github.com/fleet-ai/OpenEnv.git@deniz/task-scaling" fleet-python logfire "mcp>=1.0.0"

  # Download dataset from S3
  mkdir -p $HOME/data/fleet
  TASKS_FILE="$HOME/data/fleet/tasks_${MODALITY}.json"
  S3_PATH="s3://${S3_DATASET_BUCKET}/${DATA_VERSION}/openenv/all_${MODALITY}.json"
  echo "Downloading dataset from $S3_PATH..."
  aws s3 cp "$S3_PATH" "$TASKS_FILE"
  TASK_COUNT=$(python3 -c "import json; print(len(json.load(open('$TASKS_FILE'))['tasks']))")
  echo "Downloaded $TASK_COUNT tasks for modality: $MODALITY"

  # Prepare GRPO dataset (env contexts as prompts, no responses)
  DATA_DIR="$HOME/data/fleet/task_gen"
  PREPARE_CMD="uv run python -m integrations.fleet.prepare_task_gen_dataset --tasks-json $TASKS_FILE --output-dir $DATA_DIR --mode grpo"
  [ -n "${MAX_TASKS:-}" ] && PREPARE_CMD="$PREPARE_CMD --max-tasks $MAX_TASKS"
  eval "$PREPARE_CMD"

run: |
  set -euo pipefail
  cd skyrl-train
  source .venv/bin/activate

  TMP_DIR="$HOME/skyrl-tmp"
  mkdir -p "$TMP_DIR"
  export TMPDIR="$TMP_DIR"

  export PYTORCH_ALLOC_CONF=expandable_segments:True

  DATA_DIR="$HOME/data/fleet/task_gen"

  # Login to Weights & Biases
  uv run -- python3 -c "import wandb; wandb.login(relogin=True, key='$WANDB_API_KEY')"

  # Ray cluster setup
  export RAY_RUNTIME_ENV_HOOK=ray._private.runtime_env.uv_runtime_env_hook.hook
  export RAY_object_store_memory=10000000000
  if ! ray status --address 127.0.0.1:6479 >/dev/null 2>&1; then
    ray start --head --disable-usage-stats --port 6479 --object-store-memory=10000000000
  fi

  for i in $(seq 1 24); do
    if ray status --address 127.0.0.1:6479 >/dev/null 2>&1; then break; fi
    sleep 5
  done

  TOTAL_GPUS=$SKYPILOT_NUM_GPUS_PER_NODE

  # Run GRPO training with task-gen environment
  uv run --isolated --extra "$INFERENCE_BACKEND" \
    --with "litellm>=1.75.5" \
    --with "git+https://github.com/fleet-ai/OpenEnv.git@deniz/task-scaling" \
    --with "fleet-python" \
    --with "logfire" \
    --with "mcp>=1.0.0" \
    --with "boto3" \
    -m integrations.fleet.entrypoints.main_task_gen \
    data.train_data="['${DATA_DIR}/train.parquet']" \
    data.val_data="['${DATA_DIR}/validation.parquet']" \
    environment.env_class=task_gen \
    ++environment.skyrl_gym.task_gen.alpha=${TASK_GEN_ALPHA} \
    ++environment.skyrl_gym.task_gen.k_rollouts=${TASK_GEN_K_ROLLOUTS} \
    ++environment.skyrl_gym.task_gen.models="[${TASK_GEN_MODELS}]" \
    trainer.algorithm.advantage_estimator="grpo" \
    trainer.policy.model.path="Qwen/Qwen3-8B" \
    trainer.placement.colocate_all=true \
    trainer.strategy=fsdp2 \
    trainer.placement.policy_num_gpus_per_node=$TOTAL_GPUS \
    trainer.placement.ref_num_gpus_per_node=$TOTAL_GPUS \
    generator.num_inference_engines=$TOTAL_GPUS \
    generator.inference_engine_tensor_parallel_size=1 \
    trainer.epochs=${NUM_EPOCHS} \
    trainer.eval_batch_size=4 \
    trainer.eval_before_train=true \
    trainer.eval_interval=20 \
    trainer.update_epochs_per_batch=1 \
    trainer.train_batch_size=4 \
    trainer.use_hybrid_env_sampling=true \
    trainer.min_samples_per_env=1 \
    trainer.policy_mini_batch_size=4 \
    trainer.micro_forward_batch_size_per_gpu=2 \
    trainer.micro_train_batch_size_per_gpu=2 \
    trainer.ckpt_interval=10 \
    trainer.max_prompt_length=$MAX_INPUT_LENGTH \
    generator.max_input_length=$MAX_INPUT_LENGTH \
    generator.sampling_params.max_generate_length=$MAX_GENERATE_LENGTH \
    generator.sampling_params.temperature=1.0 \
    generator.sampling_params.top_p=0.95 \
    generator.sampling_params.stop='["</task>"]' \
    generator.eval_sampling_params.stop='["</task>"]' \
    trainer.policy.optimizer_config.lr=1.0e-6 \
    trainer.algorithm.use_kl_loss=true \
    generator.max_turns=$MAX_TURNS \
    generator.backend=$INFERENCE_BACKEND \
    generator.run_engines_locally=true \
    generator.weight_sync_backend=nccl \
    generator.async_engine=true \
    generator.batched=false \
    generator.use_conversation_multi_turn=false \
    generator.n_samples_per_prompt=4 \
    generator.eval_n_samples_per_prompt=3 \
    generator.gpu_memory_utilization=0.7 \
    trainer.logger="$LOGGER" \
    trainer.project_name="task-gen-grpo" \
    trainer.run_name="task_gen_${RUN_ID:-$(head -c 4 /dev/urandom | xxd -p)}" \
    trainer.resume_mode=latest \
    trainer.ckpt_path="$HOME/ckpts/task_gen" \
    trainer.dump_data_batch=true
