# Task Generation GRPO Training via SkyPilot - Qwen3.5-9B
# Usage: sky launch tasks/task-gen-grpo-qwen3-8b.yaml --env FLEET_API_KEY=<key> --env WANDB_API_KEY=<key>
#
# Reward: R(task) = validity_gate * (base_reward + variance + alpha * separation)
#   validity_gate: LLM-as-a-judge binary gate (valid task? 0/1)
#   base_reward:   Cold-start bootstrap (default 0.1)
#   variance:      Score variance across k Fleet harness rollouts
#   separation:    Performance gap between models (weighted by alpha)
#
# Model: Qwen/Qwen3.5-9B (9B params, GatedDeltaNet, 262K native context)
# GPUs: 4x B200/H200 (text-only fits like 8B)
# Single-turn: one generation = one task = one episode
#
# Requires vLLM >= 0.17.0 (native Qwen3.5/GDN support)

name: task-gen-grpo-qwen3-5-9b

resources:
  disk_size: 512
  ports: 6479
  any_of:
    - accelerators: B200:4
      cloud: lambda
      memory: 750+
    - accelerators: B200:4
      cloud: runpod
      memory: 750+
    - accelerators: B200:4
      cloud: primeintellect
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: lambda
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: runpod
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: vast
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: primeintellect
      memory: 750+

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: deniz/task-scaling

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  OPENROUTER_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  DATA_VERSION: "v4"
  MODALITY: "tool_use"
  # Single-turn: one task generation per episode
  MAX_TURNS: 1
  MAX_INPUT_LENGTH: 8192
  MAX_GENERATE_LENGTH: 8192
  NUM_EPOCHS: 20
  RUN_ID: ""
  MAX_TASKS: ""
  ENV_KEYS: ""
  EVAL_RATIO: "0.005"
  # Evaluator config
  JUDGE_MODEL: "anthropic/claude-sonnet-4-6"
  EVALUATOR_MODELS: '["anthropic/claude-sonnet-4.5"]'
  K_ROLLOUTS: 4
  ALPHA: "0.5"
  BASE_REWARD: "0.1"
  MAX_EVAL_STEPS: 30
  # Supabase (for DB schema discovery - read-only service role key)
  SUPABASE_URL: "https://ehefoavidbttssbleuyv.supabase.co"
  SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoZWZvYXZpZGJ0dHNzYmxldXl2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY4Nzg5ODYyMiwiZXhwIjoyMDAzNDc0NjIyfQ.lQRJ0hBuuvK1YLplS2zk_2n9MB1dJV1vv9OWHVOoQQ8"
  # AWS / S3
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  set -euo pipefail
  cd skyrl-train

  # Validate required environment variables
  echo "Validating environment variables..."
  if [ -z "$FLEET_API_KEY" ]; then echo "ERROR: FLEET_API_KEY is required"; exit 1; fi
  if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then echo "ERROR: AWS credentials required for S3 dataset download"; exit 1; fi
  echo "Environment validation passed"

  uv venv --python 3.12 --seed
  source .venv/bin/activate
  uv sync --extra vllm
  # transformers from source: Qwen3.5 model type not in stable release yet (need >=4.58.0)
  uv pip install -U "transformers @ git+https://github.com/huggingface/transformers.git"
  # flash-attn 2.8.3 prebuilt wheel for torch 2.10 + CUDA 12.8 (community build)
  uv pip install "https://github.com/lesj0910/flash-attention/releases/download/v2.8.3-cu12-torch2.10-cp312/flash_attn-2.8.3%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl"
  python -c "import torch; import torchvision; print(f'torch={torch.__version__}, torchvision={torchvision.__version__}')"
  # FlashInfer JIT compilation requires CUDA toolkit (nvcc) for GatedDeltaNet kernels (Qwen3.5)
  CUDA_HOME=""
  for d in /usr/local/cuda /usr/local/cuda-12.8 /usr/local/cuda-12.6 /usr/local/cuda-12.4; do
    if [ -x "$d/bin/nvcc" ]; then
      CUDA_HOME="$d"
      break
    fi
  done
  if [ -z "$CUDA_HOME" ] && command -v nvcc &>/dev/null; then
    NVCC_PATH=$(command -v nvcc)
    CUDA_HOME=$(dirname "$(dirname "$NVCC_PATH")")
  fi
  if [ -z "$CUDA_HOME" ]; then
    echo "nvcc not found on system. Installing CUDA toolkit from NVIDIA apt repo..."
    apt-get update -qq
    UBUNTU_VER=$(lsb_release -rs 2>/dev/null | tr -d '.' || echo "2204")
    KEYRING_URL="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb"
    echo "Installing CUDA keyring from $KEYRING_URL"
    wget -qO /tmp/cuda-keyring.deb "$KEYRING_URL" 2>&1 || curl -sLo /tmp/cuda-keyring.deb "$KEYRING_URL"
    file /tmp/cuda-keyring.deb
    dpkg -i /tmp/cuda-keyring.deb
    apt-get update -qq
    apt-get install -y --no-install-recommends cuda-nvcc-12-8 libcublas-dev-12-8 cuda-nvrtc-dev-12-8
    CUDA_HOME="/usr/local/cuda-12.8"
  fi
  export CUDA_HOME
  export PATH="$CUDA_HOME/bin:$PATH"
  echo "CUDA_HOME=$CUDA_HOME"
  "$CUDA_HOME/bin/nvcc" --version
  echo "export CUDA_HOME=$CUDA_HOME" > "$HOME/.cuda_env"
  echo "export PATH=$CUDA_HOME/bin:\$PATH" >> "$HOME/.cuda_env"
  uv pip install wandb boto3 awscli supabase

  # Install OpenEnv (from branch) for tool discovery during dataset prep
  uv pip install "git+https://github.com/fleet-ai/OpenEnv.git@deniz/task-scaling" fleet-python logfire "mcp>=1.0.0"

  # Download dataset from S3
  mkdir -p $HOME/data/fleet
  TASKS_FILE="$HOME/data/fleet/tasks_${MODALITY}.json"
  S3_PATH="s3://${S3_DATASET_BUCKET}/${DATA_VERSION}/openenv/all_${MODALITY}.json"
  echo "Downloading dataset from $S3_PATH..."
  aws s3 cp "$S3_PATH" "$TASKS_FILE"
  TASK_COUNT=$(python3 -c "import json; print(len(json.load(open('$TASKS_FILE'))['tasks']))")
  echo "Downloaded $TASK_COUNT tasks for modality: $MODALITY"

  # Prepare GRPO dataset (env contexts as prompts, tool discovery via Fleet, schema from Supabase/S3)
  DATA_DIR="$HOME/data/fleet/task_gen"
  TOOLS_CACHE="$HOME/data/fleet/tools_cache.json"
  SCHEMA_CACHE="$HOME/data/fleet/schema_cache.json"
  PREPARE_CMD="uv run python -m integrations.fleet.prepare_task_gen_dataset --tasks-json $TASKS_FILE --output-dir $DATA_DIR --mode grpo --tools-cache $TOOLS_CACHE --schema-cache $SCHEMA_CACHE"
  [ -n "${MAX_TASKS:-}" ] && PREPARE_CMD="$PREPARE_CMD --max-tasks $MAX_TASKS"
  [ -n "${ENV_KEYS:-}" ] && PREPARE_CMD="$PREPARE_CMD --env-keys $ENV_KEYS"
  [ -n "${EVAL_RATIO:-}" ] && PREPARE_CMD="$PREPARE_CMD --eval-ratio $EVAL_RATIO"
  eval "$PREPARE_CMD"

run: |
  set -euo pipefail
  cd skyrl-train
  source .venv/bin/activate

  TMP_DIR="$HOME/skyrl-tmp"
  mkdir -p "$TMP_DIR"
  export TMPDIR="$TMP_DIR"

  # CUDA_HOME for FlashInfer JIT compilation (GatedDeltaNet kernels)
  source "$HOME/.cuda_env" 2>/dev/null || true

  # expandable_segments incompatible with vLLM memory pool in torch 2.10+

  DATA_DIR="$HOME/data/fleet/task_gen"

  # Login to Weights & Biases
  python3 -c "import wandb; wandb.login(relogin=True, key='$WANDB_API_KEY')"

  # Ray cluster setup
  export RAY_RUNTIME_ENV_HOOK=ray._private.runtime_env.uv_runtime_env_hook.hook
  export RAY_object_store_memory=10000000000
  if ! ray status --address 127.0.0.1:6479 >/dev/null 2>&1; then
    ray start --head --disable-usage-stats --port 6479 --object-store-memory=10000000000
  fi

  for i in $(seq 1 24); do
    if ray status --address 127.0.0.1:6479 >/dev/null 2>&1; then break; fi
    sleep 5
  done

  TOTAL_GPUS=$SKYPILOT_NUM_GPUS_PER_NODE

  # Run GRPO training with task-gen environment
  # Use python directly since venv was set up with nightly overrides
  # (uv run --isolated would re-resolve and conflict with nightly pins)
  python -m integrations.fleet.entrypoints.main_task_gen \
    data.train_data="['${DATA_DIR}/train.parquet']" \
    data.val_data="['${DATA_DIR}/validation.parquet']" \
    environment.env_class=task_gen \
    trainer.algorithm.advantage_estimator="grpo" \
    trainer.policy.model.path="Qwen/Qwen3.5-9B" \
    trainer.placement.colocate_all=true \
    trainer.strategy=fsdp2 \
    trainer.flash_attn=false \
    trainer.use_sample_packing=false \
    trainer.placement.policy_num_gpus_per_node=$TOTAL_GPUS \
    trainer.placement.ref_num_gpus_per_node=$TOTAL_GPUS \
    generator.num_inference_engines=$TOTAL_GPUS \
    generator.inference_engine_tensor_parallel_size=1 \
    trainer.epochs=${NUM_EPOCHS} \
    trainer.eval_batch_size=4 \
    trainer.eval_before_train=true \
    trainer.eval_interval=20 \
    trainer.update_epochs_per_batch=1 \
    trainer.train_batch_size=4 \
    trainer.use_hybrid_env_sampling=true \
    trainer.min_samples_per_env=1 \
    trainer.policy_mini_batch_size=4 \
    trainer.micro_forward_batch_size_per_gpu=1 \
    trainer.micro_train_batch_size_per_gpu=1 \
    trainer.loss_chunk_size=4096 \
    trainer.ckpt_interval=10 \
    trainer.max_prompt_length=$MAX_INPUT_LENGTH \
    generator.max_input_length=$MAX_INPUT_LENGTH \
    generator.sampling_params.max_generate_length=$MAX_GENERATE_LENGTH \
    generator.sampling_params.temperature=0.9 \
    generator.sampling_params.top_p=0.95 \
    generator.sampling_params.stop='["</task>"]' \
    generator.eval_sampling_params.stop='["</task>"]' \
    trainer.policy.optimizer_config.lr=1.0e-6 \
    trainer.algorithm.use_kl_loss=true \
    generator.max_turns=$MAX_TURNS \
    generator.backend=$INFERENCE_BACKEND \
    generator.run_engines_locally=true \
    generator.weight_sync_backend=nccl \
    generator.async_engine=true \
    generator.batched=false \
    generator.trajectory_timeout_seconds=1800 \
    generator.use_conversation_multi_turn=false \
    generator.n_samples_per_prompt=4 \
    generator.eval_n_samples_per_prompt=3 \
    generator.gpu_memory_utilization=0.8 \
    trainer.logger="$LOGGER" \
    trainer.project_name="task-gen-grpo" \
    trainer.run_name="task_gen_${RUN_ID:-$(head -c 4 /dev/urandom | xxd -p)}" \
    trainer.resume_mode=latest \
    trainer.ckpt_path="$HOME/ckpts/task_gen" \
    trainer.dump_data_batch=true \
    ++environment.skyrl_gym.task_gen.judge_model="$JUDGE_MODEL" \
    ++environment.skyrl_gym.task_gen.base_reward=$BASE_REWARD \
    ++environment.skyrl_gym.task_gen.evaluator_models="$EVALUATOR_MODELS" \
    ++environment.skyrl_gym.task_gen.k_rollouts=$K_ROLLOUTS \
    ++environment.skyrl_gym.task_gen.alpha=$ALPHA \
    ++environment.skyrl_gym.task_gen.max_eval_steps=$MAX_EVAL_STEPS
