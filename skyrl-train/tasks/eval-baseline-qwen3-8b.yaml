# Baseline Evaluation: Qwen3.5-9B on Fleet Computer Use Tasks
# Usage: sky launch tasks/eval-baseline-qwen3-8b.yaml --env FLEET_API_KEY=<key>
#
# Serves Qwen3.5-9B via vLLM nightly and runs inference-only evaluation.
# Results saved to ~/eval_results/ and committed to the branch.

name: fleet-eval-baseline

resources:
  disk_size: 100
  any_of:
    - accelerators: B200:1
      cloud: lambda
    - accelerators: B200:1
      cloud: runpod
    - accelerators: B200:1
      cloud: vast
    - accelerators: B200:1
      cloud: nebius
    - accelerators: H200:1
      cloud: lambda
    - accelerators: H200:1
      cloud: runpod
    - accelerators: H200:1
      cloud: vast
    - accelerators: H200:1
      cloud: nebius

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: eval-baseline-qwen3.5-9b

envs:
  FLEET_API_KEY: ""
  MODALITY: "computer_use"
  MODEL: "Qwen/Qwen3.5-9B"
  NUM_TASKS: "2"
  ROLLOUTS_PER_TASK: "2"
  MAX_TURNS: "50"
  MAX_CONCURRENT: "16"
  TEMPERATURE: "1.0"
  # Not used by eval but expected by the GHA workflow
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  DATA_VERSION: "v51"

setup: |
  set -euo pipefail

  # Validate required env vars
  if [ -z "$FLEET_API_KEY" ]; then
    echo "ERROR: FLEET_API_KEY is required"
    exit 1
  fi

  # Install Python dev headers (needed by Triton to compile CUDA utils)
  sudo apt-get update && sudo apt-get install -y python3-dev

  cd skyrl-train

  uv venv --python 3.12 --seed
  source .venv/bin/activate

  # Install base deps with repo-pinned vLLM, then override with nightly
  uv sync --extra vllm
  uv pip install openai

  # Override with vLLM nightly (Qwen3.5 support not in stable until v0.17.0)
  uv pip install -U vllm --torch-backend=auto --extra-index-url https://wheels.vllm.ai/nightly
  # transformers from source: Qwen3.5 model type not in stable release yet
  uv pip install -U "transformers @ git+https://github.com/huggingface/transformers.git"
  # flash-attn incompatible with torch 2.10 from vLLM nightly
  uv pip uninstall flash-attn || true
  # Remove stale flashinfer-jit-cache so flashinfer regenerates it
  uv pip uninstall flashinfer-jit-cache || true

  # CUDA toolkit for FlashInfer JIT compilation (GatedDeltaNet kernels in Qwen3.5)
  CUDA_HOME=""
  for d in /usr/local/cuda /usr/local/cuda-12.8 /usr/local/cuda-12.6 /usr/local/cuda-12.4; do
    if [ -x "$d/bin/nvcc" ]; then
      CUDA_HOME="$d"
      break
    fi
  done
  if [ -z "$CUDA_HOME" ] && command -v nvcc &>/dev/null; then
    NVCC_PATH=$(command -v nvcc)
    CUDA_HOME=$(dirname "$(dirname "$NVCC_PATH")")
  fi
  if [ -z "$CUDA_HOME" ]; then
    echo "nvcc not found. Installing CUDA toolkit..."
    apt-get update -qq
    UBUNTU_VER=$(lsb_release -rs 2>/dev/null | tr -d '.' || echo "2204")
    wget -qO /tmp/cuda-keyring.deb "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb" 2>&1 || \
      curl -sLo /tmp/cuda-keyring.deb "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb"
    dpkg -i /tmp/cuda-keyring.deb
    apt-get update -qq
    apt-get install -y --no-install-recommends cuda-nvcc-12-8 libcublas-dev-12-8 cuda-nvrtc-dev-12-8
    CUDA_HOME="/usr/local/cuda-12.8"
  fi
  export CUDA_HOME
  export PATH="$CUDA_HOME/bin:$PATH"
  echo "CUDA_HOME=$CUDA_HOME"
  "$CUDA_HOME/bin/nvcc" --version
  echo "export CUDA_HOME=$CUDA_HOME" > "$HOME/.cuda_env"
  echo "export PATH=$CUDA_HOME/bin:\$PATH" >> "$HOME/.cuda_env"

  # Install OpenEnv for Fleet environment access
  uv pip install "git+https://github.com/fleet-ai/OpenEnv.git@deniz/fleet-logfire" \
    fleet-python logfire "mcp>=1.0.0"

  # Copy tasks file (use local workdir copy or download from S3)
  mkdir -p $HOME/data
  if [ -f "$HOME/all_computer_use.json" ]; then
    cp "$HOME/all_computer_use.json" "$HOME/data/tasks.json"
  else
    echo "Downloading tasks from S3..."
    pip install awscli
    aws s3 cp s3://fleet-worktrial-jp/v51/openenv/all_computer_use.json \
      "$HOME/data/tasks.json" --no-sign-request --region us-west-1
  fi

  TASK_COUNT=$(python3 -c "import json; print(len(json.load(open('$HOME/data/tasks.json'))['tasks']))")
  echo "Loaded $TASK_COUNT tasks"

run: |
  set -euo pipefail
  cd skyrl-train
  source .venv/bin/activate
  source "$HOME/.cuda_env" 2>/dev/null || true

  TASKS_FILE="$HOME/data/tasks.json"
  OUTPUT_DIR="$HOME/eval_results"
  mkdir -p "$OUTPUT_DIR"

  # Start vLLM server in background
  echo "Starting vLLM server for $MODEL..."
  python -m vllm.entrypoints.openai.api_server \
    --model "$MODEL" \
    --host 0.0.0.0 \
    --port 8000 \
    --max-model-len 262144 \
    --gpu-memory-utilization 0.85 \
    &
  VLLM_PID=$!

  # Wait for vLLM to be ready
  echo "Waiting for vLLM server..."
  for i in $(seq 1 60); do
    if curl -s http://localhost:8000/health > /dev/null 2>&1; then
      echo "vLLM server ready"
      break
    fi
    if [ $i -eq 60 ]; then
      echo "ERROR: vLLM server failed to start"
      kill $VLLM_PID 2>/dev/null || true
      exit 1
    fi
    sleep 5
  done

  # Run eval
  echo "Starting evaluation: $NUM_TASKS tasks x $ROLLOUTS_PER_TASK rollouts"
  python -m integrations.fleet.entrypoints.eval_baseline \
    --tasks-file "$TASKS_FILE" \
    --model "$MODEL" \
    --num-tasks "$NUM_TASKS" \
    --rollouts-per-task "$ROLLOUTS_PER_TASK" \
    --max-turns "$MAX_TURNS" \
    --max-concurrent "$MAX_CONCURRENT" \
    --temperature "$TEMPERATURE" \
    --output-dir "$OUTPUT_DIR"

  echo "Eval complete. Results in $OUTPUT_DIR"
  ls -la "$OUTPUT_DIR"

  # Print summary to GHA logs
  echo "===== SUMMARY ====="
  cat "$OUTPUT_DIR"/summary_*.json || true
  echo "===== TRAJECTORIES ====="
  wc -l "$OUTPUT_DIR"/*.jsonl || true

  # Upload results to S3 (best-effort, may fail without AWS creds)
  pip install awscli 2>/dev/null || true
  S3_PATH="s3://skyrl-trajectories/evals/eval-baseline-qwen3.5-9b/$(date -u +%Y%m%d_%H%M%S)"
  echo "Uploading results to $S3_PATH..."
  aws s3 cp "$OUTPUT_DIR" "$S3_PATH" --recursive || echo "S3 upload failed (no AWS creds?), skipping"

  # Commit results to the branch
  echo "Committing results to git..."
  cd ~/sky_workdir
  RESULTS_DIR="skyrl-train/eval_results"
  mkdir -p "$RESULTS_DIR"
  cp "$OUTPUT_DIR"/* "$RESULTS_DIR/"
  git config user.email "eval-bot@fleet.ai"
  git config user.name "Fleet Eval Bot"
  git add "$RESULTS_DIR/"
  git commit -m "eval results: $MODEL — ${NUM_TASKS} tasks x ${ROLLOUTS_PER_TASK} rollouts ($(date -u +%Y-%m-%d %H:%M))"
  git push origin HEAD || echo "Git push failed, results are in GHA logs above"

  # Cleanup
  kill $VLLM_PID 2>/dev/null || true
