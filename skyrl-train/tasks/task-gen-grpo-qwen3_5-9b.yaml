# Task Generation GRPO Training via SkyPilot - Qwen3.5-9B
# Usage: sky launch tasks/task-gen-grpo-qwen3_5-9b.yaml --env FLEET_API_KEY=<key> --env WANDB_API_KEY=<key>
#
# Reward: R(task) = llm_validity * (alpha * var(raw_scores) + (p_hint - p_raw))
#   llm_validity:    LLM-as-a-judge binary gate (valid task? 0/1)
#   var(raw_scores): Variance of k raw evaluator rollouts (difficulty calibration)
#   p_hint - p_raw:  Hint gap — solvable with hints but not without (learnability)
#   alpha:           Weight balancing variance vs hint gap (default 0.5)
#
# Model: Qwen/Qwen3.5-9B (9B params, GatedDeltaNet, 262K native context)
# GPUs: 8x B200/H200 (text-only fits like 8B)
# Multi-turn: model explores seed DB via describe_db/query_db before generating task
#
# Requires vLLM >= 0.17.0 (native Qwen3.5/GDN support)

name: task-gen-grpo-qwen3-5-9b

resources:
  disk_size: 512
  ports: 6479
  any_of:
    - accelerators: H200:8
      cloud: gcp
      memory: 1500+
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305
    - accelerators: B200:8
      cloud: lambda
      memory: 1500+
    - accelerators: B200:8
      cloud: runpod
      memory: 1500+
    - accelerators: B200:8
      cloud: primeintellect
      memory: 1500+
    - accelerators: H200-SXM:8
      cloud: lambda
      memory: 1500+
    - accelerators: H200-SXM:8
      cloud: runpod
      memory: 1500+
    - accelerators: H200-SXM:8
      cloud: vast
      memory: 1500+
    - accelerators: H200-SXM:8
      cloud: primeintellect
      memory: 1500+

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: deniz/multi-turn-task-gen

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  OPENROUTER_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  DATA_VERSION: "v4"
  MODALITY: "tool_use"
  # Multi-turn: exploration + generation (DB queries + tool calls + task)
  MAX_TURNS: 10
  MAX_INPUT_LENGTH: 8192
  MAX_GENERATE_LENGTH: 8192
  NUM_EPOCHS: 20
  RUN_ID: ""
  MAX_TASKS: ""
  ENV_KEYS: ""
  EVAL_RATIO: "0.005"
  # Evaluator config (hint-based: k raw + k hinted rollouts via FleetTaskEnv)
  JUDGE_MODEL: "anthropic/claude-sonnet-4-6"
  K_ROLLOUTS: 4
  ALPHA: "0.5"
  MAX_EVAL_STEPS: 30
  # Supabase (for DB schema discovery - read-only service role key)
  SUPABASE_URL: "https://ehefoavidbttssbleuyv.supabase.co"
  SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoZWZvYXZpZGJ0dHNzYmxldXl2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY4Nzg5ODYyMiwiZXhwIjoyMDAzNDc0NjIyfQ.lQRJ0hBuuvK1YLplS2zk_2n9MB1dJV1vv9OWHVOoQQ8"
  # AWS / S3
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  # Common setup: venv, deps, Qwen3.5 extras (transformers, flash-attn, CUDA, causal-conv1d)
  # --extra-pip supabase: task-gen needs Supabase client for DB schema discovery
  # --skip-prepare: task-gen uses prepare_task_gen_dataset (different from default prepare_dataset)
  bash skyrl-train/scripts/fleet-common-setup.sh \
    --openenv-branch deniz/db-query-tools \
    --extra-setup skyrl-train/scripts/fleet-qwen35-extra-setup.sh \
    --extra-pip supabase \
    --skip-prepare

  # Task-gen dataset preparation (parquet with schema/tools context per environment)
  cd skyrl-train && source .venv/bin/activate
  DATA_ROOT="$([ -d /workspace ] && [ -w /workspace ] && echo /workspace || echo $HOME)"
  TASKS_FILE="$DATA_ROOT/data/fleet/tasks_${MODALITY}.json"
  DATA_DIR="$DATA_ROOT/data/fleet/task_gen"
  PREPARE_CMD="python -m integrations.fleet.prepare_task_gen_dataset --tasks-json $TASKS_FILE --output-dir $DATA_DIR --mode grpo --tools-cache $DATA_ROOT/data/fleet/tools_cache.json --schema-cache $DATA_ROOT/data/fleet/schema_cache.json"
  [ -n "${MAX_TASKS:-}" ] && PREPARE_CMD="$PREPARE_CMD --max-tasks $MAX_TASKS"
  [ -n "${ENV_KEYS:-}" ] && PREPARE_CMD="$PREPARE_CMD --env-keys $ENV_KEYS"
  [ -n "${EVAL_RATIO:-}" ] && PREPARE_CMD="$PREPARE_CMD --eval-ratio $EVAL_RATIO"
  eval "$PREPARE_CMD"

run: |
  # Task-gen GRPO training via shared run script
  # --entrypoint: task-gen entrypoint (not main_fleet)
  # --env-class: task_gen environment (not fleet_task)
  # --data-dir-name: parquet files are in data/fleet/task_gen/ (not data/fleet/tool_use/)
  # TP=2: 4 engines × 2 GPUs each (task-gen has smaller batches, needs more GPU memory for evaluator)
  bash skyrl-train/scripts/fleet-common-run.sh \
    --use-python-direct --cuda-env "$HOME/.cuda_env" \
    --set-ulimit --no-pytorch-alloc-conf \
    --entrypoint integrations.fleet.entrypoints.main_task_gen \
    --env-class task_gen \
    --data-dir-name task_gen -- \
    trainer.algorithm.advantage_estimator="grpo" \
    trainer.policy.model.path="Qwen/Qwen3.5-9B" \
    trainer.flash_attn=false \
    trainer.use_sample_packing=false \
    generator.num_inference_engines=4 \
    generator.inference_engine_tensor_parallel_size=2 \
    trainer.epochs=${NUM_EPOCHS} \
    trainer.eval_batch_size=4 \
    trainer.eval_before_train=false \
    trainer.eval_interval=20 \
    trainer.update_epochs_per_batch=1 \
    trainer.train_batch_size=4 \
    trainer.use_hybrid_env_sampling=true \
    trainer.min_samples_per_env=1 \
    trainer.policy_mini_batch_size=4 \
    trainer.micro_forward_batch_size_per_gpu=1 \
    trainer.micro_train_batch_size_per_gpu=1 \
    trainer.loss_chunk_size=4096 \
    trainer.ckpt_interval=10 \
    trainer.max_prompt_length=$MAX_INPUT_LENGTH \
    generator.max_input_length=$MAX_INPUT_LENGTH \
    generator.sampling_params.max_generate_length=$MAX_GENERATE_LENGTH \
    generator.sampling_params.temperature=0.9 \
    generator.sampling_params.top_p=0.95 \
    'generator.sampling_params.stop=["</tool_call>", "</task>"]' \
    'generator.eval_sampling_params.stop=["</tool_call>", "</task>"]' \
    trainer.policy.optimizer_config.lr=1.0e-6 \
    trainer.algorithm.use_kl_loss=true \
    generator.max_turns=$MAX_TURNS \
    generator.backend=$INFERENCE_BACKEND \
    generator.run_engines_locally=true \
    generator.weight_sync_backend=nccl \
    generator.async_engine=true \
    generator.batched=false \
    generator.trajectory_timeout_seconds=1800 \
    generator.use_conversation_multi_turn=true \
    generator.n_samples_per_prompt=4 \
    generator.eval_n_samples_per_prompt=3 \
    generator.gpu_memory_utilization=0.15 \
    trainer.logger="$LOGGER" \
    trainer.project_name="task-gen-grpo" \
    trainer.run_name="task_gen_${RUN_ID:-$(head -c 4 /dev/urandom | xxd -p)}" \
    trainer.resume_mode=latest \
    trainer.ckpt_path="$HOME/ckpts/task_gen" \
    trainer.dump_data_batch=true \
    ++environment.skyrl_gym.task_gen.max_turns=$MAX_TURNS \
    ++environment.skyrl_gym.task_gen.judge_model="$JUDGE_MODEL" \
    ++environment.skyrl_gym.task_gen.k_rollouts=$K_ROLLOUTS \
    ++environment.skyrl_gym.task_gen.alpha=$ALPHA \
    ++environment.skyrl_gym.task_gen.max_eval_steps=$MAX_EVAL_STEPS
