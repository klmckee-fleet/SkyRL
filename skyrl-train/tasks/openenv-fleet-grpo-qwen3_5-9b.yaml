# Fleet Task GRPO Training via SkyPilot - Qwen3.5-9B (Text-Only / Tool Use)
# Usage: sky launch tasks/openenv-fleet-grpo-qwen3_5-9b.yaml --env FLEET_API_KEY=<key> --env WANDB_API_KEY=<key>
#
# Text-only (tool_use) training — replaces Qwen3-8B as the default.
#
# Model: Qwen/Qwen3.5-9B (9B parameters, natively multimodal, early fusion + GatedDeltaNet)
# GPUs: 8x B200/H200 (RunPod, Lambda, Vast, Nebius, GCP)
#
# NOTE: Requires vLLM >= 0.17.0 for native Qwen3.5/GDN support + FlashAttention 4
#
# v0.1: Initial Qwen3.5-9B tool_use config adapted from CU version
# v0.2: Refactored to use shared scripts (fleet-common-setup/run.sh)

name: fleet-task-grpo-qwen3-5-9b

resources:
  disk_size: 750
  ports: 6479
  any_of:
    # 8x GPUs — GCP temporarily disabled (SkyPilot SIGABRT during GCP VM creation)
    - accelerators: H200-SXM:8
      cloud: runpod
    - accelerators: B200:8
      cloud: runpod
    - accelerators: B200:8
      cloud: lambda
    - accelerators: H200-SXM:8
      cloud: vast
    - accelerators: B200:8
      cloud: nebius
    - accelerators: H200-SXM:8
      cloud: nebius

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: main

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  # Dataset version: "v54" (v53 with 12 cross-contaminated verifiers patched)
  DATA_VERSION: "v54"
  # Task selection: env_keys to filter (comma-separated, e.g., "github,booking,reddit")
  ENV_KEYS: ""
  # Difficulty filter: 1=easy, 2=medium, 3=hard (comma-separated, e.g., "1,2" for easy+medium)
  DIFFICULTY: ""
  # Modality: text-only tool use
  MODALITY: "tool_use"
  # Training parameters
  MAX_TURNS: 50
  MAX_INPUT_LENGTH: 64000
  MAX_GENERATE_LENGTH: 4096
  NUM_EPOCHS: 20
  RUN_ID: ""
  MAX_TASKS: ""
  # AWS credentials (required for S3 dataset download, optional for checkpoint upload)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  # S3 buckets
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  bash skyrl-train/scripts/fleet-common-setup.sh \
    --openenv-branch deniz/fleet_client \
    --extra-setup skyrl-train/scripts/fleet-qwen35-extra-setup.sh \
    --skip-uv-isolated

run: |
  # === Diagnostics ===
  echo "=== SYSTEM DIAGNOSTICS ==="
  free -h
  nvidia-smi --query-gpu=index,name,driver_version,memory.total,memory.free --format=csv
  nvidia-smi topo -m 2>/dev/null | head -20 || true
  nvidia-smi nvlink -s 2>/dev/null | head -20 || true
  echo "=== END DIAGNOSTICS ==="

  # === Fabric Manager ===
  echo "=== FABRIC MANAGER ==="
  systemctl status nvidia-fabricmanager 2>&1 || true
  sudo journalctl -u nvidia-fabricmanager --no-pager -n 30 2>&1 || true
  sudo nvidia-smi -pm 1 2>&1 || true
  sudo systemctl start nvidia-fabricmanager 2>&1 || true
  sleep 3
  FM_STATUS=$(systemctl is-active nvidia-fabricmanager 2>/dev/null || echo "unknown")
  echo "FM status: $FM_STATUS"
  if [ "$FM_STATUS" != "active" ]; then
    sudo systemctl stop nvidia-fabricmanager 2>&1 || true
    sleep 2
    sudo nvidia-smi -r 2>&1 || true
    sleep 2
    sudo systemctl start nvidia-fabricmanager 2>&1 || true
    sleep 5
    FM_STATUS=$(systemctl is-active nvidia-fabricmanager 2>/dev/null || echo "unknown")
    echo "FM status after retry: $FM_STATUS"
    sudo journalctl -u nvidia-fabricmanager --no-pager -n 20 --since "1 minute ago" 2>&1 || true
  fi
  echo "=== END FM ==="

  # === NCCL Shim ===
  echo "=== NCCL SHIM ==="
  ls -la /nccl-shim/lib/ 2>/dev/null || echo "/nccl-shim not found"
  ldconfig -p 2>/dev/null | grep -i nccl || true
  env | grep -i NCCL || echo "No NCCL vars set"
  echo "=== END NCCL SHIM ==="

  # CRITICAL: Do NOT set NCCL env vars on GCP. The GCP NCCL shim manages everything.
  unset NCCL_P2P_DISABLE NCCL_NVLS_ENABLE NCCL_CUMEM_ENABLE NCCL_DEBUG NCCL_DEBUG_SUBSYS 2>/dev/null || true
  export RAY_DISABLE_MEMORY_MONITOR=1
  export HYDRA_FULL_ERROR=1

  # GPU monitor
  nvidia-smi dmon -s mu -d 2 > /tmp/gpu_monitor.log 2>&1 &
  GPU_MON_PID=$!

  # === Run training ===
  set +e
  bash skyrl-train/scripts/fleet-common-run.sh \
    --use-python-direct --cuda-env "$HOME/.cuda_env" \
    --set-ulimit --no-pytorch-alloc-conf -- \
    environment.skyrl_gym.fleet_task.ttl_seconds=900 \
    trainer.algorithm.advantage_estimator=grpo \
    trainer.policy.model.path="Qwen/Qwen3.5-9B" \
    trainer.flash_attn=true \
    trainer.loss_chunk_size=4096 \
    trainer.use_sample_packing=false \
    +generator.chat_template_kwargs='{enable_thinking:true}' \
    generator.inference_engine_tensor_parallel_size=1 \
    trainer.epochs=${NUM_EPOCHS} \
    trainer.eval_batch_size=12 \
    trainer.eval_before_train=true \
    trainer.eval_interval=20 \
    trainer.update_epochs_per_batch=1 \
    trainer.train_batch_size=24 \
    trainer.use_hybrid_env_sampling=true \
    trainer.min_samples_per_env=1 \
    trainer.policy_mini_batch_size=24 \
    trainer.micro_forward_batch_size_per_gpu=1 \
    trainer.micro_train_batch_size_per_gpu=1 \
    trainer.ckpt_interval=10 \
    trainer.max_prompt_length=2048 \
    generator.max_input_length=$MAX_INPUT_LENGTH \
    generator.sampling_params.max_generate_length=$MAX_GENERATE_LENGTH \
    generator.sampling_params.temperature=0.9 \
    generator.sampling_params.top_p=0.95 \
    'generator.sampling_params.stop=["</tool_call>"]' \
    'generator.eval_sampling_params.stop=["</tool_call>"]' \
    trainer.policy.optimizer_config.lr=1.0e-6 \
    trainer.algorithm.use_kl_loss=true \
    generator.max_turns=$MAX_TURNS \
    generator.backend=$INFERENCE_BACKEND \
    generator.run_engines_locally=true \
    generator.weight_sync_backend=nccl \
    generator.async_engine=true \
    generator.batched=false \
    generator.use_conversation_multi_turn=true \
    generator.n_samples_per_prompt=4 \
    generator.eval_n_samples_per_prompt=3 \
    generator.enforce_eager=false \
    generator.gpu_memory_utilization=0.85 \
    trainer.logger="$LOGGER" \
    trainer.project_name="fleet-task-grpo" \
    trainer.run_name="fleet_qwen35_${MODALITY}_${RUN_ID:-$(head -c 4 /dev/urandom | xxd -p)}" \
    trainer.resume_mode=latest \
    trainer.ckpt_path="$HOME/ckpts/fleet_qwen35_${MODALITY}" \
    trainer.export_path="$HOME/exports" \
    trainer.dump_data_batch=true
  EXIT_CODE=$?
  set -e

  # Stop GPU monitor
  kill $GPU_MON_PID 2>/dev/null || true

  # === Post-training diagnostics ===
  echo "=== POST-TRAINING (exit code: $EXIT_CODE) ==="
  echo "--- dmesg (OOM/segfault/kill) ---"
  sudo dmesg -T 2>/dev/null | grep -iE "oom|kill|out of memory|segfault|sigsegv|general protection|traps:" | tail -40 || true
  echo "--- Memory state ---"
  free -h
  echo "--- GPU state ---"
  nvidia-smi --query-gpu=index,memory.used,memory.free,memory.total --format=csv 2>/dev/null || true
  echo "--- GPU monitor (last 30 lines) ---"
  tail -30 /tmp/gpu_monitor.log 2>/dev/null || true
  echo "--- NCCL env vars at crash time ---"
  env | grep -i NCCL || echo "No NCCL vars"
  echo "=== END POST-TRAINING ==="

  exit $EXIT_CODE
