# Fleet Task GRPO Training via SkyPilot - Qwen3.5-9B (Text-Only / Tool Use)
# Usage: sky launch tasks/openenv-fleet-grpo-qwen3_5-9b.yaml --env FLEET_API_KEY=<key> --env WANDB_API_KEY=<key>
#
# Text-only (tool_use) training — replaces Qwen3-8B as the default.
#
# Model: Qwen/Qwen3.5-9B (9B parameters, natively multimodal, early fusion + GatedDeltaNet)
# GPUs: 8x B200/H200 (RunPod, Lambda, Vast, Nebius, GCP)
#
# NOTE: Requires vLLM >= 0.17.0 for native Qwen3.5/GDN support + FlashAttention 4
#
# v0.1: Initial Qwen3.5-9B tool_use config adapted from CU version
# v0.2: Refactored to use shared scripts (fleet-common-setup/run.sh)

name: fleet-task-grpo-qwen3-5-9b

resources:
  disk_size: 750
  ports: 6479
  any_of:
    # 8x GPUs (matching VL branch config)
    - accelerators: H200-SXM:8
      cloud: runpod
    - accelerators: B200:8
      cloud: runpod
    - accelerators: B200:8
      cloud: lambda
    - accelerators: H200-SXM:8
      cloud: vast
    - accelerators: B200:8
      cloud: nebius
    - accelerators: H200-SXM:8
      cloud: nebius
    # GCP spot fallback
    - accelerators: B200:8
      cloud: gcp
      use_spot: true
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305
    - accelerators: H200:8
      cloud: gcp
      use_spot: true
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: main

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  # Dataset version: "v54" (v53 with 12 cross-contaminated verifiers patched)
  DATA_VERSION: "v54"
  # Task selection: env_keys to filter (comma-separated, e.g., "github,booking,reddit")
  ENV_KEYS: ""
  # Difficulty filter: 1=easy, 2=medium, 3=hard (comma-separated, e.g., "1,2" for easy+medium)
  DIFFICULTY: ""
  # Modality: text-only tool use
  MODALITY: "tool_use"
  # Training parameters
  MAX_TURNS: 50
  MAX_INPUT_LENGTH: 64000
  MAX_GENERATE_LENGTH: 4096
  NUM_EPOCHS: 20
  RUN_ID: ""
  MAX_TASKS: ""
  # AWS credentials (required for S3 dataset download, optional for checkpoint upload)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  # S3 buckets
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  bash skyrl-train/scripts/fleet-common-setup.sh \
    --openenv-branch deniz/fleet_client \
    --extra-setup skyrl-train/scripts/fleet-qwen35-extra-setup.sh \
    --skip-uv-isolated

run: |
  # === Pre-training diagnostics ===
  echo "=== SYSTEM DIAGNOSTICS ==="
  echo "--- Memory ---"
  free -h
  echo "--- cgroup memory limit ---"
  cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "cgroup: not available"
  echo "--- vm.overcommit ---"
  cat /proc/sys/vm/overcommit_memory
  echo "--- GPU info ---"
  nvidia-smi --query-gpu=index,name,driver_version,memory.total,memory.free --format=csv
  echo "--- Fabric Manager ---"
  systemctl is-active nvidia-fabricmanager 2>/dev/null || echo "fabricmanager: unknown"
  echo "--- GPU topology ---"
  nvidia-smi topo -m 2>/dev/null | head -20 || true
  echo "=== END DIAGNOSTICS ==="

  # Start background GPU memory monitor (every 2 seconds)
  nvidia-smi dmon -s mu -d 2 > /tmp/gpu_monitor.log 2>&1 &
  GPU_MON_PID=$!

  # === Try to start Fabric Manager if it's not running ===
  echo "--- Attempting to start Fabric Manager ---"
  sudo systemctl start nvidia-fabricmanager 2>&1 || true
  sleep 2
  FM_STATUS=$(systemctl is-active nvidia-fabricmanager 2>/dev/null || echo "unknown")
  echo "Fabric Manager status after start attempt: $FM_STATUS"

  # === Env vars for diagnostics ===
  export NCCL_NVLS_ENABLE=0
  # Disable NVLink P2P if Fabric Manager is not running — forces SHM transport
  if [ "$FM_STATUS" != "active" ]; then
    echo "WARNING: Fabric Manager not active ($FM_STATUS), disabling NCCL P2P"
    export NCCL_P2P_DISABLE=1
  fi
  export RAY_DISABLE_MEMORY_MONITOR=1
  export NCCL_DEBUG=INFO
  export NCCL_DEBUG_SUBSYS=INIT,NET
  export HYDRA_FULL_ERROR=1

  # === Inline-patch fsdp_utils.py to add GPU memory diagnostics ===
  FSDP_FILE="skyrl-train/skyrl_train/distributed/fsdp_utils.py"
  python3 << 'PATCH_EOF'
  import pathlib
  p = pathlib.Path("skyrl-train/skyrl_train/distributed/fsdp_utils.py")
  code = p.read_text()

  # Patch 1: Add GPU memory helper at the top of fsdp2_load_full_state_dict
  old = "def fsdp2_load_full_state_dict(model: torch.nn.Module, full_sd: dict, cpu_offload=None):"
  new = """def _fsdp_gpu_mem_info():
      import subprocess, os
      try:
          gpu_id = os.environ.get('CUDA_VISIBLE_DEVICES', str(torch.cuda.current_device()))
          r = subprocess.run(['nvidia-smi', '--query-gpu=memory.used,memory.free,memory.total', '--format=csv,noheader', f'--id={torch.cuda.current_device()}'], capture_output=True, text=True, timeout=5)
          return r.stdout.strip()
      except: return 'N/A'

  def fsdp2_load_full_state_dict(model: torch.nn.Module, full_sd: dict, cpu_offload=None):"""
  code = code.replace(old, new, 1)

  # Patch 2: Add logging before the broadcast loop
  old2 = "    meta_sharded_sd = model.state_dict()\n    sharded_sd = {}"
  new2 = """    import os, sys
      rank = dist.get_rank()
      num_params = len(full_sd) if dist.get_rank() == 0 else 0
      print(f'[FSDP_DIAG] Rank {rank} PID {os.getpid()} entering fsdp2_load_full_state_dict, GPU mem: {_fsdp_gpu_mem_info()}', flush=True)
      meta_sharded_sd = model.state_dict()
      sharded_sd = {}
      print(f'[FSDP_DIAG] Rank {rank} got meta_sharded_sd ({len(meta_sharded_sd)} params), GPU mem: {_fsdp_gpu_mem_info()}', flush=True)"""
  code = code.replace(old2, new2, 1)

  # Patch 3: Add logging inside rank-0 loop (every 50 params)
  old3 = "    if dist.get_rank() == 0:\n        for (param_name, full_param), sharded_param in zip(full_sd.items(), meta_sharded_sd.values()):\n            full_param = full_param.detach().cuda()"
  new3 = """    if dist.get_rank() == 0:
          _param_idx = 0
          for (param_name, full_param), sharded_param in zip(full_sd.items(), meta_sharded_sd.values()):
              if _param_idx % 50 == 0:
                  print(f'[FSDP_DIAG] Rank 0 broadcasting param {_param_idx}/{len(full_sd)}: {param_name} shape={full_param.shape} dtype={full_param.dtype}, GPU mem: {_fsdp_gpu_mem_info()}', flush=True)
              _param_idx += 1
              full_param = full_param.detach().cuda()"""
  code = code.replace(old3, new3, 1)

  # Patch 4: Add logging inside non-rank-0 loop
  old4 = "    else:\n        for param_name, sharded_param in meta_sharded_sd.items():\n            full_tensor = torch.empty(sharded_param.size(), device=\"cuda\", dtype=sharded_param.dtype)"
  new4 = """    else:
          _param_idx = 0
          for param_name, sharded_param in meta_sharded_sd.items():
              if _param_idx % 50 == 0:
                  print(f'[FSDP_DIAG] Rank {rank} receiving param {_param_idx}/{len(meta_sharded_sd)}: {param_name} shape={sharded_param.size()} dtype={sharded_param.dtype}, GPU mem: {_fsdp_gpu_mem_info()}', flush=True)
              _param_idx += 1
              full_tensor = torch.empty(sharded_param.size(), device="cuda", dtype=sharded_param.dtype)"""
  code = code.replace(old4, new4, 1)

  # Patch 5: Add logging after load_state_dict
  old5 = "    model.load_state_dict(sharded_sd, assign=True)"
  new5 = """    print(f'[FSDP_DIAG] Rank {rank} finished broadcast loop, calling load_state_dict, GPU mem: {_fsdp_gpu_mem_info()}', flush=True)
      model.load_state_dict(sharded_sd, assign=True)
      print(f'[FSDP_DIAG] Rank {rank} load_state_dict done, GPU mem: {_fsdp_gpu_mem_info()}', flush=True)"""
  code = code.replace(old5, new5, 1)

  p.write_text(code)
  print("Patched fsdp_utils.py with GPU memory diagnostics")
  PATCH_EOF

  # Also patch fsdp_strategy.py to log around the FSDP2 init
  python3 << 'PATCH2_EOF'
  import pathlib
  p = pathlib.Path("skyrl-train/skyrl_train/distributed/fsdp_strategy.py")
  code = p.read_text()

  old = '            module = model.model if is_wrapped else model\n            full_state = module.state_dict()'
  new = """            module = model.model if is_wrapped else model
              import subprocess, os
              try:
                  r = subprocess.run(['nvidia-smi', '--query-gpu=memory.used,memory.free', '--format=csv,noheader'], capture_output=True, text=True, timeout=5)
                  print(f'[FSDP2_INIT] Rank {dist.get_rank()} GPU mem before state_dict: {r.stdout.strip()}', flush=True)
              except: pass
              full_state = module.state_dict()
              print(f'[FSDP2_INIT] Rank {dist.get_rank()} state_dict captured ({len(full_state)} params), about to apply_fsdp2', flush=True)"""
  code = code.replace(old, new, 1)

  old2 = '            apply_fsdp2(module, fsdp_kwargs, self.fsdp_config)\n            fsdp2_load_full_state_dict(module, full_state, cpu_offload)'
  new2 = """            apply_fsdp2(module, fsdp_kwargs, self.fsdp_config)
              print(f'[FSDP2_INIT] Rank {dist.get_rank()} apply_fsdp2 done, starting fsdp2_load_full_state_dict', flush=True)
              fsdp2_load_full_state_dict(module, full_state, cpu_offload)
              print(f'[FSDP2_INIT] Rank {dist.get_rank()} fsdp2_load_full_state_dict done!', flush=True)"""
  code = code.replace(old2, new2, 1)

  p.write_text(code)
  print("Patched fsdp_strategy.py with FSDP2 init diagnostics")
  PATCH2_EOF

  # === Run training ===
  set +e
  bash skyrl-train/scripts/fleet-common-run.sh \
    --use-python-direct --cuda-env "$HOME/.cuda_env" \
    --set-ulimit --no-pytorch-alloc-conf -- \
    environment.skyrl_gym.fleet_task.ttl_seconds=900 \
    trainer.algorithm.advantage_estimator=grpo \
    trainer.policy.model.path="Qwen/Qwen3.5-9B" \
    trainer.flash_attn=true \
    trainer.loss_chunk_size=4096 \
    trainer.use_sample_packing=false \
    +generator.chat_template_kwargs='{enable_thinking:true}' \
    generator.inference_engine_tensor_parallel_size=1 \
    trainer.epochs=${NUM_EPOCHS} \
    trainer.eval_batch_size=12 \
    trainer.eval_before_train=true \
    trainer.eval_interval=20 \
    trainer.update_epochs_per_batch=1 \
    trainer.train_batch_size=24 \
    trainer.use_hybrid_env_sampling=true \
    trainer.min_samples_per_env=1 \
    trainer.policy_mini_batch_size=24 \
    trainer.micro_forward_batch_size_per_gpu=1 \
    trainer.micro_train_batch_size_per_gpu=1 \
    trainer.ckpt_interval=10 \
    trainer.max_prompt_length=2048 \
    generator.max_input_length=$MAX_INPUT_LENGTH \
    generator.sampling_params.max_generate_length=$MAX_GENERATE_LENGTH \
    generator.sampling_params.temperature=0.9 \
    generator.sampling_params.top_p=0.95 \
    'generator.sampling_params.stop=["</tool_call>"]' \
    'generator.eval_sampling_params.stop=["</tool_call>"]' \
    trainer.policy.optimizer_config.lr=1.0e-6 \
    trainer.algorithm.use_kl_loss=true \
    generator.max_turns=$MAX_TURNS \
    generator.backend=$INFERENCE_BACKEND \
    generator.run_engines_locally=true \
    generator.weight_sync_backend=nccl \
    generator.async_engine=true \
    generator.batched=false \
    generator.use_conversation_multi_turn=true \
    generator.n_samples_per_prompt=4 \
    generator.eval_n_samples_per_prompt=3 \
    generator.enforce_eager=false \
    generator.gpu_memory_utilization=0.85 \
    trainer.logger="$LOGGER" \
    trainer.project_name="fleet-task-grpo" \
    trainer.run_name="fleet_qwen35_${MODALITY}_${RUN_ID:-$(head -c 4 /dev/urandom | xxd -p)}" \
    trainer.resume_mode=latest \
    trainer.ckpt_path="$HOME/ckpts/fleet_qwen35_${MODALITY}" \
    trainer.export_path="$HOME/exports" \
    trainer.dump_data_batch=true
  EXIT_CODE=$?
  set -e

  # Stop GPU monitor
  kill $GPU_MON_PID 2>/dev/null || true

  # === Post-training diagnostics ===
  echo "=== POST-TRAINING (exit code: $EXIT_CODE) ==="
  echo "--- dmesg (OOM/segfault/kill) ---"
  sudo dmesg -T 2>/dev/null | grep -iE "oom|kill|out of memory|segfault|sigsegv|general protection|traps:" | tail -40 || true
  echo "--- Memory state ---"
  free -h
  echo "--- GPU state ---"
  nvidia-smi --query-gpu=index,memory.used,memory.free,memory.total --format=csv 2>/dev/null || true
  echo "--- GPU monitor (last 30 lines) ---"
  tail -30 /tmp/gpu_monitor.log 2>/dev/null || true
  echo "=== END POST-TRAINING ==="

  exit $EXIT_CODE
