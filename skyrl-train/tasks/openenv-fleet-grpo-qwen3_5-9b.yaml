# Fleet Task GRPO Training via SkyPilot - Qwen3.5-9B (Text-Only / Tool Use)
# Usage: sky launch tasks/openenv-fleet-grpo-qwen3_5-9b.yaml --env FLEET_API_KEY=<key> --env WANDB_API_KEY=<key>
#
# Text-only (tool_use) training — replaces Qwen3-8B as the default.
#
# Model: Qwen/Qwen3.5-9B (9B parameters, natively multimodal, early fusion + GatedDeltaNet)
# GPUs: 4x B200/H200 — text-only fits like 8B (no vision encoder active)
#
# NOTE: Requires vLLM nightly (>=0.16.1.dev0) — Qwen3.5 support not in stable until v0.17.0
# NOTE: config.json patched to TransformersForCausalLM so vLLM uses HF's AutoModelForCausalLM
#       (same as FSDP), ensuring weight names match for NCCL weight sync
#
# v0.1: Initial Qwen3.5-9B tool_use config adapted from CU version

name: fleet-task-grpo-qwen3-5-9b

resources:
  disk_size: 500
  ports: 6479
  any_of:
    # 4x GPUs for text-only (same as Qwen3-8B)
    - accelerators: B200:4
      cloud: lambda
      memory: 750+
    - accelerators: B200:4
      cloud: runpod
      memory: 750+
    - accelerators: B200:4
      cloud: primeintellect
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: lambda
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: runpod
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: vast
      memory: 750+
    - accelerators: H200-SXM:4
      cloud: primeintellect
      memory: 750+

num_nodes: 1

workdir:
  url: https://github.com/fleet-ai/SkyRL.git
  ref: feat/qwen3.5-9b-tool-use

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  # Dataset version: "v51" (5,479 tasks, latest curated)
  DATA_VERSION: "v51"
  # Task selection: env_keys to filter (comma-separated, e.g., "github,booking,reddit")
  ENV_KEYS: ""
  # Difficulty filter: 1=easy, 2=medium, 3=hard (comma-separated, e.g., "1,2" for easy+medium)
  DIFFICULTY: ""
  # Modality: text-only tool use
  MODALITY: "tool_use"
  # Training parameters
  MAX_TURNS: 50
  # Context: Qwen3.5-9B has native 262K context, no YaRN needed
  # 64K input allows headroom for large tool schemas
  MAX_INPUT_LENGTH: 64000
  MAX_GENERATE_LENGTH: 8192  # Tool calls need space for thinking + tool calls
  NUM_EPOCHS: 20
  RUN_ID: ""
  # Optional: limit number of tasks for testing
  MAX_TASKS: ""
  # AWS credentials (required for S3 dataset download, optional for checkpoint upload)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  # S3 buckets
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  set -euo pipefail
  cd skyrl-train

  # Validate required environment variables
  echo "Validating environment variables..."
  if [ -z "$FLEET_API_KEY" ]; then
    echo "ERROR: FLEET_API_KEY is required"
    exit 1
  fi
  if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
    echo "ERROR: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are required for S3 dataset download"
    exit 1
  fi
  if [ "$MODALITY" != "tool_use" ] && [ "$MODALITY" != "computer_use" ]; then
    echo "ERROR: MODALITY must be 'tool_use' or 'computer_use', got: $MODALITY"
    exit 1
  fi
  echo "Environment validation passed"

  uv venv --python 3.12 --seed
  source .venv/bin/activate
  uv sync --extra vllm
  # Override with vllm nightly (Qwen3.5 support requires nightly, not in stable until v0.17.0)
  # Use --index-url (not --extra-index-url) to force nightly instead of stable from PyPI
  # --torch-backend=auto handles torch+torchvision ABI matching automatically
  uv pip install -U vllm --torch-backend=auto --index-url https://wheels.vllm.ai/nightly
  python -c "import vllm; print(f'vLLM version: {vllm.__version__}')"
  # Verify Qwen3.5 support exists (either native qwen3_5 module or Qwen3Next mapping)
  python -c "from vllm.model_executor.models import _MODELS; q35=[k for k in _MODELS if 'Qwen3_5' in k or 'Qwen3Next' in k]; print(f'Qwen3.5 models in vLLM: {q35}'); print('WARNING: No native Qwen3.5, will patch config.json') if not q35 else None"
  # flash-attn 2.8.3 only supports torch<=2.9, incompatible with torch 2.10 (vllm nightly)
  # vLLM uses FlashInfer instead; training uses SDPA (PyTorch's built-in flash attention)
  uv pip uninstall flash-attn
  # Remove stale flashinfer-jit-cache (0.5.3+cu128 from uv sync) so flashinfer 0.6.4 regenerates it
  uv pip uninstall flashinfer-jit-cache || true
  python -c "import torch; import torchvision; print(f'torch={torch.__version__}, torchvision={torchvision.__version__}')"
  # FlashInfer JIT compilation requires CUDA toolkit (nvcc) for GatedDeltaNet kernels (Qwen3.5)
  # pip CUDA packages are incomplete (missing nv/target headers); use NVIDIA apt repo instead
  CUDA_HOME=""
  for d in /usr/local/cuda /usr/local/cuda-12.8 /usr/local/cuda-12.6 /usr/local/cuda-12.4; do
    if [ -x "$d/bin/nvcc" ]; then
      CUDA_HOME="$d"
      break
    fi
  done
  if [ -z "$CUDA_HOME" ] && command -v nvcc &>/dev/null; then
    NVCC_PATH=$(command -v nvcc)
    CUDA_HOME=$(dirname "$(dirname "$NVCC_PATH")")
  fi
  if [ -z "$CUDA_HOME" ]; then
    echo "nvcc not found on system. Installing CUDA toolkit from NVIDIA apt repo..."
    apt-get update -qq
    UBUNTU_VER=$(lsb_release -rs 2>/dev/null | tr -d '.' || echo "2204")
    KEYRING_URL="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb"
    echo "Installing CUDA keyring from $KEYRING_URL"
    wget -qO /tmp/cuda-keyring.deb "$KEYRING_URL" 2>&1 || curl -sLo /tmp/cuda-keyring.deb "$KEYRING_URL"
    file /tmp/cuda-keyring.deb
    dpkg -i /tmp/cuda-keyring.deb
    apt-get update -qq
    apt-get install -y --no-install-recommends cuda-nvcc-12-8 libcublas-dev-12-8 cuda-nvrtc-dev-12-8
    CUDA_HOME="/usr/local/cuda-12.8"
  fi
  export CUDA_HOME
  export PATH="$CUDA_HOME/bin:$PATH"
  echo "CUDA_HOME=$CUDA_HOME"
  "$CUDA_HOME/bin/nvcc" --version
  echo "export CUDA_HOME=$CUDA_HOME" > "$HOME/.cuda_env"
  echo "export PATH=$CUDA_HOME/bin:\$PATH" >> "$HOME/.cuda_env"
  uv pip install wandb boto3 awscli

  # Install OpenEnv for Fleet environment access (from branch with FleetTaskEnv)
  uv pip install "litellm>=1.75.5" "git+https://github.com/fleet-ai/OpenEnv.git@deniz/fleet-logfire" fleet-python logfire "mcp>=1.0.0"

  # transformers from source: Qwen3.5 model type requires transformers>=4.58.0 (not in PyPI stable).
  # MUST be installed LAST because litellm pins transformers<5.0 and would downgrade it.
  uv pip install -U --no-deps "transformers @ git+https://github.com/huggingface/transformers.git"
  python -c "import transformers; print(f'transformers={transformers.__version__}')"
  # Patch: vLLM nightly imports ALLOWED_LAYER_TYPES from transformers, but
  # transformers main split it into ALLOWED_ATTENTION_LAYER_TYPES + ALLOWED_MLP_LAYER_TYPES.
  python -c "import transformers.configuration_utils as cu, inspect; src=inspect.getfile(cu); has_it=hasattr(cu,'ALLOWED_LAYER_TYPES'); alias=getattr(cu,'ALLOWED_ATTENTION_LAYER_TYPES',None); print(f'ALLOWED_LAYER_TYPES exists={has_it}'); (not has_it and alias and (open(src,'a').write(chr(10)+'ALLOWED_LAYER_TYPES = ALLOWED_ATTENTION_LAYER_TYPES'+chr(10)) or print(f'Patched {src}'))) if not has_it and alias else None"
  python -c "from transformers.configuration_utils import ALLOWED_LAYER_TYPES; print('ALLOWED_LAYER_TYPES OK:', ALLOWED_LAYER_TYPES)"

  # Pre-download model weights to a local directory to avoid race condition
  # when 4 FSDP + 4 vLLM workers all resolve HuggingFace cache simultaneously
  MODEL_DIR="$HOME/models/Qwen3.5-9B"
  echo "Pre-downloading Qwen/Qwen3.5-9B model weights to $MODEL_DIR..."
  python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3.5-9B', local_dir='$MODEL_DIR')"
  echo "Model download complete. Files:"
  ls -la "$MODEL_DIR"/*.safetensors 2>/dev/null | head -10
  # Verify all shards present
  python -c "import json,os,sys; idx=json.load(open('$MODEL_DIR/model.safetensors.index.json')); shards=set(idx['weight_map'].values()); missing=[s for s in shards if not os.path.exists(os.path.join('$MODEL_DIR',s))]; (print(f'ERROR: Missing shards: {missing}',file=sys.stderr) or sys.exit(1)) if missing else print(f'All {len(shards)} shards verified OK')"
  # Always patch config.json to use TransformersForCausalLM backend in vLLM.
  # This ensures vLLM loads Qwen3_5ForCausalLM via HuggingFace AutoModelForCausalLM —
  # the same class FSDP uses — so weight names match exactly during NCCL weight sync.
  # Native vLLM Qwen3.5 handler uses different weight naming + FlashInfer JIT, causing NCCL timeouts.
  python -c "import json; cfg_path='$MODEL_DIR/config.json'; cfg=json.load(open(cfg_path)); orig=cfg.get('architectures',[]); cfg['architectures']=['TransformersForCausalLM']; json.dump(cfg,open(cfg_path,'w'),indent=2); print(f'Patched config.json: {orig} -> TransformersForCausalLM')"

  # Download dataset from S3
  mkdir -p $HOME/data/fleet
  TASKS_FILE="$HOME/data/fleet/tasks_${MODALITY}.json"
  S3_PATH="s3://${S3_DATASET_BUCKET}/${DATA_VERSION}/openenv/all_${MODALITY}.json"
  echo "Downloading dataset from $S3_PATH..."
  aws s3 cp "$S3_PATH" "$TASKS_FILE"
  TASK_COUNT=$(python3 -c "import json; print(len(json.load(open('$TASKS_FILE'))['tasks']))")
  echo "Downloaded $TASK_COUNT tasks for modality: $MODALITY"

  # Prepare dataset (with optional env/difficulty filters)
  DATA_DIR="$HOME/data/fleet/${MODALITY}"
  PREPARE_CMD="python -m integrations.fleet.prepare_dataset --tasks-json $TASKS_FILE --output-dir $DATA_DIR --modality $MODALITY"
  [ -n "$ENV_KEYS" ] && PREPARE_CMD="$PREPARE_CMD --env-filter $ENV_KEYS"
  [ -n "$DIFFICULTY" ] && PREPARE_CMD="$PREPARE_CMD --difficulty-filter $DIFFICULTY"
  eval "$PREPARE_CMD"

run: |
  set -euo pipefail
  cd skyrl-train
  source .venv/bin/activate

  TMP_DIR="$HOME/skyrl-tmp"
  mkdir -p "$TMP_DIR"
  export TMPDIR="$TMP_DIR"

  # CUDA_HOME for FlashInfer JIT compilation (GatedDeltaNet kernels)
  source "$HOME/.cuda_env" 2>/dev/null || true

  # expandable_segments incompatible with vLLM memory pool in torch 2.10+
  # (AssertionError: pytorch/pytorch#147851)

  # Debug: show all Ray worker logs (don't deduplicate) and NCCL debug info
  export RAY_DEDUP_LOGS=0
  export NCCL_DEBUG=WARN
  export NCCL_DEBUG_SUBSYS=ALL
  # Reduce NCCL timeout to fail fast instead of hanging for 10 minutes
  export NCCL_TIMEOUT=300

  TASKS_FILE="$HOME/data/fleet/tasks_${MODALITY}.json"
  DATA_DIR="$HOME/data/fleet/${MODALITY}"

  # Login to Weights & Biases
  python3 -c "import wandb; wandb.login(relogin=True, key='$WANDB_API_KEY')"

  # Ray cluster setup - limit object store to prevent disk exhaustion
  export RAY_RUNTIME_ENV_HOOK=ray._private.runtime_env.uv_runtime_env_hook.hook
  export RAY_object_store_memory=10000000000  # 10GB limit for object store
  if ! ray status --address 127.0.0.1:6479 >/dev/null 2>&1; then
    ray start --head --disable-usage-stats --port 6479 --object-store-memory=10000000000
  fi

  # Wait for Ray
  for i in $(seq 1 24); do
    if ray status --address 127.0.0.1:6479 >/dev/null 2>&1; then
      break
    fi
    sleep 5
  done

  TOTAL_GPUS=$SKYPILOT_NUM_GPUS_PER_NODE

  # Run GRPO training with Fleet task integration
  # Use python directly since venv was set up in setup with nightly overrides
  # (uv run --isolated would re-resolve and conflict with nightly pins)
  python -m integrations.fleet.entrypoints.main_fleet \
    data.train_data="['${DATA_DIR}/train.parquet']" \
    data.val_data="['${DATA_DIR}/validation.parquet']" \
    environment.env_class=fleet_task \
    environment.skyrl_gym.fleet_task.tasks_file="$TASKS_FILE" \
    environment.skyrl_gym.fleet_task.ttl_seconds=900 \
    trainer.algorithm.advantage_estimator="grpo" \
    trainer.policy.model.path="$HOME/models/Qwen3.5-9B" \
    trainer.placement.colocate_all=true \
    trainer.strategy=fsdp2 \
    trainer.flash_attn=false \
    trainer.use_sample_packing=false \
    trainer.placement.policy_num_gpus_per_node=$TOTAL_GPUS \
    trainer.placement.ref_num_gpus_per_node=$TOTAL_GPUS \
    generator.num_inference_engines=$TOTAL_GPUS \
    generator.inference_engine_tensor_parallel_size=1 \
    trainer.epochs=${NUM_EPOCHS} \
    trainer.eval_batch_size=24 \
    trainer.eval_before_train=true \
    trainer.eval_interval=20 \
    trainer.update_epochs_per_batch=1 \
    trainer.train_batch_size=24 \
    trainer.use_hybrid_env_sampling=true \
    trainer.min_samples_per_env=1 \
    trainer.policy_mini_batch_size=24 \
    trainer.micro_forward_batch_size_per_gpu=1 \
    trainer.micro_train_batch_size_per_gpu=1 \
    trainer.ckpt_interval=10 \
    trainer.max_prompt_length=$MAX_INPUT_LENGTH \
    generator.max_input_length=$MAX_INPUT_LENGTH \
    generator.sampling_params.max_generate_length=$MAX_GENERATE_LENGTH \
    generator.sampling_params.temperature=0.9 \
    generator.sampling_params.top_p=0.95 \
    generator.sampling_params.stop='["</tool_call>"]' \
    generator.eval_sampling_params.stop='["</tool_call>"]' \
    trainer.policy.optimizer_config.lr=1.0e-6 \
    trainer.algorithm.use_kl_loss=true \
    generator.max_turns=$MAX_TURNS \
    generator.backend=$INFERENCE_BACKEND \
    generator.run_engines_locally=true \
    generator.weight_sync_backend=nccl \
    generator.async_engine=true \
    generator.batched=false \
    generator.use_conversation_multi_turn=true \
    generator.n_samples_per_prompt=4 \
    generator.eval_n_samples_per_prompt=3 \
    generator.gpu_memory_utilization=0.8 \
    +generator.engine_init_kwargs.max_model_len=73728 \
    trainer.logger="$LOGGER" \
    trainer.project_name="fleet-task-grpo" \
    trainer.run_name="fleet_qwen35_${MODALITY}_${RUN_ID:-$(head -c 4 /dev/urandom | xxd -p)}" \
    trainer.resume_mode=latest \
    trainer.ckpt_path="$HOME/ckpts/fleet_qwen35_${MODALITY}" \
    trainer.dump_data_batch=true
